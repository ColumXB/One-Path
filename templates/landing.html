{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One-Path</title>
  <link rel="stylesheet" href="{% static 'landing.css' %}">
</head>
<body>
  <form id="csrfForm" hidden>{% csrf_token %}</form>
  <div class="layout">
    <aside class="left" aria-label="Parameters">
      <h1>One-Path</h1>

      <button type="button" class="run-btn" id="runButton">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>
        <span>Run</span>
      </button>

      <!-- General -->
      <section class="section" aria-labelledby="h-general">
        <h2 id="h-general">General</h2>

        <div class="param">
          <div class="param-head">
            <label for="bruteForce">Brute Force</label>
            <span class="switch">
              <input type="checkbox" id="bruteForce" role="switch">
              <span class="track"></span>
            </span>
          </div>
        </div>

        <div class="param results" role="group" aria-label="Algorithm runtimes">
          <div class="result">
            <span class="label" id="time-brute-force-label">Brute force time</span>
            <output class="value is-na" id="time-brute-force"
                    aria-labelledby="time-brute-force-label">NA</output>
          </div>
          <div class="result">
            <span class="label" id="time-genetic-label">Genetic algorithm time</span>
            <output class="value is-na" id="time-genetic"
                    aria-labelledby="time-genetic-label">NA</output>
          </div>
          <p>Brute force supports up to 10 islands.</p>
        </div>

        <div class="param" data-slider data-id="islands" data-min="3" data-max="20" data-value="5" data-step="1"></div>
        <div class="param" data-slider data-id="boats" data-min="2" data-max="100" data-value="10" data-step="1"></div>

        <div class="param">
          <fieldset id="fitness">
            <legend>Fitness Function</legend>
            <label class="tick"><input type="checkbox" name="fitness" value="manhattan"> Manhattan</label>
            <label class="tick"><input type="checkbox" name="fitness" value="euclidean" checked> Euclidean</label>
            <label class="tick"><input type="checkbox" name="fitness" value="chebyshev"> Chebyshev</label>
          </fieldset>
        </div>
      </section>

      <!-- Genetic algorithm -->
      <section class="section" id="gaSection" aria-labelledby="h-ga">
        <h2 id="h-ga">Genetic algorithm</h2>
        <div class="controls">
          <div class="param" data-slider data-id="tournamentSize" data-min="1" data-max="100" data-max-from="boats" data-value="3" data-step="1"></div>
          <div class="param" data-slider data-id="generations" data-min="1" data-max="500" data-value="50" data-step="1"></div>
          <div class="param" data-slider data-id="mutation" data-min="0" data-max="100" data-value="5" data-step="1" data-unit="%"></div>
          <div class="param" data-slider data-id="crossover" data-min="0" data-max="100" data-value="75" data-step="1" data-unit="%"></div>
          <div class="param" data-slider data-id="elitism" data-min="0" data-max="100" data-value="10" data-step="1" data-unit="%"></div>
        </div>
      </section>

      <!-- Output -->
      <section class="section" aria-labelledby="h-out">
        <h2 id="h-out">Last run</h2>
        <div class="results" aria-live="polite">
          <div class="result"><span class="label">Best route</span><span class="value is-na" id="res-best">NA</span></div>
          <div class="result"><span class="label">Median route</span><span class="value is-na" id="res-median">NA</span></div>
          <div class="result"><span class="label">Worst route</span><span class="value is-na" id="res-worst">NA</span></div>
        </div>
        <p id="runStatus" aria-live="polite"></p>
      </section>
    </aside>

    <main class="right">
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <script src="{% static 'landing.js' %}"></script>
</body>
</html>
